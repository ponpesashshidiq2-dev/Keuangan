<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tanda Tangan Slip Gaji</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  body { background: #f1f5f9; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 18px 12px 40px; }
  .slip-wrap { width: 100%; max-width: 680px; }
  .slip-card { background: #fff; border: 1px solid var(--border, #e2e8f0); border-radius: 14px; overflow: hidden; box-shadow: 0 8px 26px rgba(15, 23, 42, .08); }
  .slip-head { padding: 16px 18px; border-bottom: 1px solid var(--border, #e2e8f0); display: flex; gap: 12px; align-items: center; }
  .slip-logo { width: 52px; height: 52px; border-radius: 10px; background: #0ea5e9; color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; overflow: hidden; flex: none; font-size: 15px; }
  .slip-logo img { width: 100%; height: 100%; object-fit: cover; }
  .slip-head h1 { font-size: 16px; margin: 0; }
  .slip-head p { margin: 2px 0 0; font-size: 12.5px; color: #64748b; }
  .slip-body { padding: 14px 18px 20px; }
  .slip-rincian { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .slip-ttd-label { font-size: 13px; color: #64748b; margin: 14px 0 6px; }
  .tt-box { border: 2px dashed #94a3b8; border-radius: 10px; background: #fff; overflow: hidden; touch-action: none; }
  .tt-box canvas { display: block; width: 100%; height: auto; cursor: crosshair; }
  .tt-aksi { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .tt-status { margin-top: 10px; padding: 10px 12px; border-radius: 10px; font-size: 13px; }
  .tt-status.ok { background: #dcfce7; color: #166534; }
  .tt-status.err { background: #fee2e2; color: #991b1b; }
  .tt-status img { display: block; max-height: 60px; margin-top: 6px; background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; }
  .slip-foot { padding: 10px 18px 16px; font-size: 11.5px; color: #94a3b8; text-align: center; }
  /* footer tanda tangan: Mengetahui (kiri) — Diterima (kanan, tempat tanda tangan penerima) */
  #ttdFoot { gap: 20px; margin-top: 24px; }
  #ttdFoot .bk-dua { gap: 16px; }
  #ttdFoot .bk-satu { min-width: 116px; }
  #ttdFoot .bk-ttd-kanan { min-width: 250px; text-align: center; }
  #ttdFoot .st-tgl { margin-bottom: 6px; font-size: 12.5px; }
  #ttdFoot .st-ttd-ruang { height: 54px; }
</style>
</head>
<body>
<div class="slip-wrap">
  <div class="slip-card">
    <div class="slip-head">
      <div class="slip-logo" id="logo">…</div>
      <div>
        <h1 id="namaPes">Memuat…</h1>
        <p id="alamatPes"></p>
        <p id="webTelp"></p>
      </div>
    </div>
    <div class="slip-body">
      <div id="isi">
        <p class="slip-ttd-label">Memuat data slip…</p>
      </div>

      <p class="slip-ttd-label" id="ttdHint" hidden>✍️ Gambar <strong>tanda tangan penerima</strong> di kotak <strong>Diterima</strong> di bawah ini (pakai jari atau mouse) — tanda tangan akan otomatis terisi pada kolom penerimaan di slip gaji.</p>

      <footer class="surat-ttd" id="ttdFoot" hidden>
        <div class="bk-ttd-kiri">
          <div class="bk-h">Mengetahui</div>
          <div class="bk-dua">
            <div class="bk-satu">
              <div class="bk-jab">Mudir</div>
              <div class="st-ttd-ruang"></div>
              <div class="st-nama" id="nmMudir">-</div>
            </div>
            <div class="bk-satu">
              <div class="bk-jab">Bendahara</div>
              <div class="st-ttd-ruang"></div>
              <div class="st-nama" id="nmBend">-</div>
            </div>
          </div>
        </div>
        <div class="bk-ttd-kanan" id="ttdArea" hidden>
          <div class="st-tgl" id="ttdTgl"></div>
          <div class="bk-jab">Diterima</div>
          <div class="tt-box"><canvas id="tt-cv"></canvas></div>
          <div class="st-nama" id="nmTerima"></div>
          <div class="tt-aksi">
            <button class="btn" id="tt-clear" type="button">🧽 Bersihkan</button>
            <button class="btn btn-primary" id="tt-ok" type="button">✔️ Simpan Tanda Tangan</button>
          </div>
          <div class="tt-status" id="tt-status" hidden></div>
        </div>
      </footer>

      <div class="tt-status err" id="galat" hidden></div>
    </div>
    <div class="slip-foot">Halaman ini khusus untuk menandatangani slip gaji — tanpa login.</div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var BLN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]; }); };
  var angkaKw = function (n) { return (Number(n) || 0).toLocaleString('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
  var kw = function (n) { return 'Rp ' + angkaKw(n); };
  /* Jumlah 1 komponen = volume × satuan (harga per satuan) — volume kosong → satuan langsung = jumlah */
  var jmlKomp = function (nom, vol) { vol = Number(vol) || 0; nom = Number(nom) || 0; return vol > 0 ? Math.round(vol * nom) : nom; };
  var periodeLabel = function (p) { var a = String(p || '').split('-'); return (BLN[Number(a[1]) - 1] || a[1] || '') + ' ' + (a[0] || ''); };
  var tglPanjang = function (d) { var a = String(d || '').split('-'); return (Number(a[2]) || '') + ' ' + (BLN[Number(a[1]) - 1] || '') + ' ' + (a[0] || ''); };

  /* Terbilang utk baris "Terbilang" pada bukti pengeluaran kas */
  var TERBI = ['nol','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan','sepuluh','sebelas'];
  function terbilang(n) {
    n = Math.floor(Math.abs(Number(n) || 0));
    if (n < 12) return TERBI[n];
    if (n < 20) return TERBI[n - 10] + ' belas';
    if (n < 100) { var a1 = terbilang(Math.floor(n / 10)), b1 = n % 10; return (a1 ? a1 + ' puluh' : '') + (b1 ? ' ' + terbilang(b1) : ''); }
    if (n < 200) return n === 100 ? 'seratus' : 'seratus ' + terbilang(n - 100);
    if (n < 1000) { var a2 = terbilang(Math.floor(n / 100)), b2 = n % 100; return (a2 ? a2 + ' ratus' : '') + (b2 ? ' ' + terbilang(b2) : ''); }
    if (n < 2000) return n === 1000 ? 'seribu' : 'seribu ' + terbilang(n - 1000);
    var skala = [[1e12,'triliun'],[1e9,'miliar'],[1e6,'juta'],[1e3,'ribu']];
    for (var i = 0; i < skala.length; i++) {
      if (n >= skala[i][0]) {
        var a3 = terbilang(Math.floor(n / skala[i][0])), b3 = n % skala[i][0];
        return (a3 ? a3 + ' ' + skala[i][1] : '') + (b3 ? (a3 ? ' ' : '') + terbilang(b3) : '');
      }
    }
    return '';
  }
  function terbilangRapi(n) {
    var s = terbilang(n).replace(/\s+/g, ' ').trim();
    return (s ? s.charAt(0).toUpperCase() + s.slice(1) : 'Nol') + ' rupiah';
  }

  var qs = new URLSearchParams(location.search);
  var id = qs.get('id') || '';
  var gid = qs.get('g') || '';
  var slip = null;
  var sudahSimpan = false;

  var h = function (r) {
    return r.json().then(function (j) {
      if (!r.ok) { throw new Error(j.error || ('HTTP ' + r.status)); }
      return j;
    });
  };
  var api = function (body) {
    return fetch('api.php?p=gaji&act=terima', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(h);
  };

  function galat(t) {
    var e = document.getElementById('galat');
    e.textContent = t; e.hidden = false;
  }

  /* ---------- kanvas tanda tangan ---------- */
  var cv = document.getElementById('tt-cv');
  var W = 500, H = 170;
  function siapkanKanvas() {
    var dpr = window.devicePixelRatio || 1;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = '100%'; cv.style.height = 'auto'; cv.style.touchAction = 'none';
    var g = cv.getContext('2d');
    g.scale(dpr, dpr);
    g.lineWidth = 3; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#0f172a';
    var gambar = false, last = null;
    var posisi = function (e) {
      var r = cv.getBoundingClientRect();
      return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
    };
    cv.addEventListener('pointerdown', function (e) { gambar = true; last = posisi(e); cv.setPointerCapture(e.pointerId); e.preventDefault(); });
    cv.addEventListener('pointermove', function (e) {
      if (!gambar) return;
      var p = posisi(e);
      g.beginPath(); g.moveTo(last.x, last.y); g.lineTo(p.x, p.y); g.stroke();
      last = p; e.preventDefault();
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
      cv.addEventListener(ev, function () { gambar = false; });
    });
    return g;
  }
  var ctx = siapkanKanvas();

  function adaGoresan() {
    /* piksel tak-putih = ada tanda tangan */
    try {
      var d = ctx.getImageData(0, 0, cv.width, cv.height).data;
      for (var i = 0; i < d.length; i += 4) {
        if (d[i + 3] !== 0 && (d[i] < 240 || d[i + 1] < 240 || d[i + 2] < 240)) { return true; }
      }
    } catch (e) {}
    return false;
  }

  document.getElementById('tt-clear').onclick = function () {
    ctx.clearRect(0, 0, cv.width, cv.height);
    var st = document.getElementById('tt-status');
    st.hidden = true; sudahSimpan = false;
  };

  document.getElementById('tt-ok').onclick = async function () {
    if (sudahSimpan) { return; }
    if (!adaGoresan()) { return galat('Gambar tanda tangan dulu di kotak putih sebelum menyimpan.'); }
    var btn = this;
    btn.disabled = true;
    try {
      var r = await api({ id: id, gid: gid, ttd: cv.toDataURL('image/png') });
      sudahSimpan = true;
      var st = document.getElementById('tt-status');
      st.className = 'tt-status ok';
      st.innerHTML = '✅ Tanda tangan penerimaan <strong>tersimpan</strong>' +
        (r.ttd_pada ? ' — ' + esc(new Date(r.ttd_pada).toLocaleString('id-ID')) : '') +
        '. Slip gaji kini menampilkan tanda tangan Anda pada kolom penerima.<img alt="tanda tangan" src="' + cv.toDataURL('image/png') + '">';
      st.hidden = false;
      document.getElementById('galat').hidden = true;
    } catch (e) {
      galat(e.message || 'Gagal menyimpan tanda tangan');
      btn.disabled = false;
    }
  };

  /* ---------- baris rincian: Keterangan | Vol | Satuan | Total ---------- */
  function anak(ket, nom, vol) {
    var jum = jmlKomp(nom, vol);
    if (jum <= 0) { return ''; }
    return '<tr><td class="num muted">&#8627;</td><td>' + esc(ket) + '</td>' +
      '<td class="num">' + (Number(vol) > 0 ? esc(String(vol)) : '') + '</td>' +
      '<td class="num">' + kw(nom) + '</td>' +
      '<td class="num">' + kw(jum) + '</td></tr>';
  }
  function grup(huruf, nama, isi) {
    return isi ? '<tr class="bk-grp"><td class="num"><strong>' + huruf + '</strong></td><td colspan="4"><strong>' + esc(nama) + '</strong></td></tr>' + isi : '';
  }

  /* ---------- muat data slip ---------- */
  fetch('api.php?p=gaji&act=terima&id=' + encodeURIComponent(id) + '&g=' + encodeURIComponent(gid))
    .then(h)
    .then(function (d) {
      slip = d.slip;
      var p = d.profil || {};
      var lg = document.getElementById('logo');
      if (p.logo) { lg.innerHTML = '<img alt="logo" src="' + esc(p.logo) + '">'; }
      else { lg.textContent = String(p.logo_teks || 'PP').slice(0, 3).toUpperCase(); }
      document.getElementById('namaPes').textContent = p.nama_pesantren || 'Pesantren';
      document.getElementById('alamatPes').textContent = p.alamat || '';
      var wt = [p.web, p.telp].filter(Boolean).map(esc).join(' · ');
      document.getElementById('webTelp').textContent = wt;
      document.title = 'Slip Gaji ' + (slip.nama || '');

      var r = slip.rincian || {};
      var rinciIns = (Array.isArray(r.insentif_rinci) ? r.insentif_rinci : [])
        .filter(function (e) { return e && Number(e.nominal) > 0; })
        .map(function (e) { return anak(e.nama || 'Insentif', e.nominal, e.volume); }).join('')
        || anak('Insentif', r.insentif, 0);
      var totalIns = (Array.isArray(r.insentif_rinci) && r.insentif_rinci.length)
        ? r.insentif_rinci.reduce(function (a, e) { return a + jmlKomp(e.nominal, e.volume); }, 0)
        : (Number(r.insentif) || 0);
      var rPokok = anak('Gaji Pokok', r.gaji_pokok, r.gaji_pokok_vol);
      var rTunj  = anak('Tunjangan', r.tunjangan, r.tunjangan_vol);
      var rPot   = anak('Potongan', r.potongan, r.potongan_vol);
      var hari = '';
      try { hari = new Date(slip.tanggal + 'T00:00:00').toLocaleDateString('id-ID', { weekday: 'long' }); } catch (e) {}
      var ket = [slip.akun, slip.sumber_dana].filter(Boolean).join(' ← ');

      document.getElementById('isi').innerHTML =
        '<div class="bk-no">Nomor&nbsp;&nbsp;:&nbsp;&nbsp;<strong>' + esc(slip.no_bkk || '-') + '</strong></div>' +
        '<h3 class="bk-judul">BUKTI PENGELUARAN KAS<br>' + esc(String(p.nama_pesantren || '').toUpperCase()) + '<br>GAJI GURU DAN KARYAWAN</h3>' +
        '<table class="surat-meta bk-info">' +
          '<tr><td class="k">Tanggal</td><td class="c">:</td><td class="v">' + esc((hari ? hari + ', ' : '') + tglPanjang(slip.tanggal)) + '</td></tr>' +
          '<tr><td class="k">Periode</td><td class="c">:</td><td class="v">' + esc(periodeLabel(slip.periode)) + '</td></tr>' +
          '<tr><td class="k">Jumlah</td><td class="c">:</td><td class="v"><strong>' + kw(r.total) + '</strong></td></tr>' +
          '<tr><td class="k">Terbilang</td><td class="c">:</td><td class="v"><em>' + esc(terbilangRapi(r.total)) + '</em></td></tr>' +
          '<tr><td class="k">Dibayarkan Kepada</td><td class="c">:</td><td class="v"><strong>' + esc(slip.nama) + '</strong>' + (slip.jabatan ? ' — ' + esc(slip.jabatan) : '') + '</td></tr>' +
          '<tr><td class="k">Keterangan</td><td class="c">:</td><td class="v">' + esc(ket) + '</td></tr>' +
        '</table>' +
        '<table class="surat-tbl bk-tbl slip-rincian">' +
          '<thead><tr>' +
            '<th class="num" style="width:44px">No</th><th>Keterangan</th>' +
            '<th class="num" style="width:62px">Vol</th>' +
            '<th class="num" style="width:130px">Satuan</th>' +
            '<th class="num" style="width:140px">Total</th>' +
          '</tr></thead>' +
          '<tbody>' +
            grup('A', 'Gaji Pokok', rPokok) +
            grup('B', 'Tunjangan', rTunj) +
            (rinciIns ? '<tr class="bk-grp"><td class="num"><strong>C</strong></td><td colspan="4"><strong>Insentif</strong></td></tr>' + rinciIns +
              '<tr class="bk-sub"><td></td><td colspan="3"><strong>Total Insentif</strong></td><td class="num"><strong>' + kw(totalIns) + '</strong></td></tr>' : '') +
            grup('D', 'Potongan', rPot) +
            '<tr class="bk-total"><td></td><td colspan="3"><strong>Jumlah terima</strong></td><td class="num"><strong>' + kw(r.total) + '</strong></td></tr>' +
          '</tbody>' +
        '</table>';

      document.getElementById('ttdFoot').hidden = false;
      document.getElementById('ttdHint').hidden = false;
      document.getElementById('ttdArea').hidden = false;
      document.getElementById('nmMudir').textContent = p.nama_mudir || '-';
      document.getElementById('nmBend').textContent = p.nama_bendahara || '-';
      document.getElementById('nmTerima').textContent = slip.nama || '-';
      document.getElementById('ttdTgl').textContent = [p.kota, tglPanjang(slip.tanggal)].filter(Boolean).join(', ');

      if (slip.ttd) {
        var st = document.getElementById('tt-status');
        st.className = 'tt-status ok';
        st.innerHTML = '✅ Slip ini <strong>sudah ditandatangani</strong>' +
          (slip.ttd_pada ? ' pada ' + esc(new Date(slip.ttd_pada).toLocaleString('id-ID')) : '') +
          '. Ingin mengganti? Gambar tanda tangan baru lalu klik Simpan.<img alt="tanda tangan tersimpan" src="' + esc(slip.ttd) + '">';
        st.hidden = false;
        document.getElementById('tt-ok').textContent = '✔️ Simpan Tanda Tangan Baru';
        sudahSimpan = false;   /* boleh ditimpa dengan yang baru */
      }
    })
    .catch(function (e) {
      galat(e.message || 'Gagal memuat data slip gaji');
      document.getElementById('namaPes').textContent = 'Slip Gaji';
    });
})();
</script>
</body>
</html>
